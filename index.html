<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Explore - Discover Repositories</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --color-canvas-default: #0d1117;
        --color-canvas-subtle: #161b22;
        --color-border-default: #30363d;
        --color-border-muted: #21262d;
        --color-fg-default: #e6edf3;
        --color-fg-muted: #7d8590;
        --color-fg-subtle: #6e7681;
        --color-accent-fg: #58a6ff;
        --color-accent-emphasis: #1f6feb;
        --color-success-fg: #3fb950;
        --color-danger-fg: #f85149;
        --color-warning-fg: #d29922;
        --color-btn-bg: #21262d;
        --color-btn-border: #30363d;
        --color-btn-hover-bg: #30363d;
        --color-input-bg: #0d1117;
        --color-input-border: #30363d;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
          Helvetica, Arial, sans-serif;
        background-color: var(--color-canvas-default);
        color: var(--color-fg-default);
        line-height: 1.5;
        min-height: 100vh;
      }

      .header {
        background-color: var(--color-canvas-subtle);
        border-bottom: 1px solid var(--color-border-default);
        padding: 16px 0;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-content {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 20px;
        font-weight: 600;
        color: var(--color-fg-default);
        text-decoration: none;
      }

      .logo i {
        font-size: 24px;
      }

      .search-container {
        flex: 1;
        max-width: 400px;
        margin: 0 32px;
        position: relative;
      }

      .search-input {
        width: 100%;
        padding: 8px 12px 8px 40px;
        background-color: var(--color-input-bg);
        border: 1px solid var(--color-input-border);
        border-radius: 6px;
        color: var(--color-fg-default);
        font-size: 14px;
      }

      .search-input:focus {
        outline: none;
        border-color: var(--color-accent-emphasis);
        box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3);
      }

      .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--color-fg-muted);
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background-color: var(--color-btn-bg);
        border: 1px solid var(--color-btn-border);
        border-radius: 6px;
        font-size: 12px;
        color: var(--color-fg-muted);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--color-success-fg);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .main-content {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px;
      }

      .page-header {
        margin-bottom: 32px;
      }

      .page-title {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .page-description {
        color: var(--color-fg-muted);
        font-size: 16px;
        margin-bottom: 24px;
      }

      .filters {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 32px;
        flex-wrap: wrap;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .filter-label {
        color: var(--color-fg-muted);
        font-size: 14px;
        font-weight: 500;
      }

      .filter-tag {
        background-color: var(--color-btn-bg);
        border: 1px solid var(--color-btn-border);
        border-radius: 16px;
        padding: 4px 12px;
        font-size: 12px;
        color: var(--color-fg-default);
        cursor: pointer;
        transition: all 0.2s;
      }

      .filter-tag:hover {
        background-color: var(--color-btn-hover-bg);
      }

      .filter-tag.active {
        background-color: var(--color-accent-emphasis);
        border-color: var(--color-accent-emphasis);
        color: white;
      }

      .clear-filters {
        background-color: transparent;
        border: 1px solid var(--color-danger-fg);
        color: var(--color-danger-fg);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .clear-filters:hover {
        background-color: var(--color-danger-fg);
        color: white;
      }

      .repositories-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 24px;
      }

      .repository-card {
        background-color: var(--color-canvas-subtle);
        border: 1px solid var(--color-border-default);
        border-radius: 8px;
        padding: 20px;
        transition: all 0.2s;
        cursor: pointer;
      }

      .repository-card:hover {
        border-color: var(--color-border-muted);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .repo-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .repo-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--color-accent-fg);
        text-decoration: none;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .repo-name:hover {
        text-decoration: underline;
      }

      .repo-visibility {
        font-size: 12px;
        color: var(--color-fg-muted);
        background-color: var(--color-btn-bg);
        border: 1px solid var(--color-btn-border);
        border-radius: 12px;
        padding: 2px 8px;
      }

      .repo-description {
        color: var(--color-fg-muted);
        font-size: 14px;
        margin-bottom: 16px;
        line-height: 1.4;
      }

      .repo-stats {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
        font-size: 12px;
        color: var(--color-fg-muted);
      }

      .repo-stat {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .repo-language {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--color-fg-muted);
      }

      .clone-button {
        display: flex;
        align-items: center;
        gap: 6px;
        background-color: var(--color-success-fg);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        margin-top: 12px;
        width: fit-content;
      }

      .clone-button:hover {
        background-color: #2ea043;
        transform: translateY(-1px);
      }

      .clone-button i {
        font-size: 11px;
      }

      .language-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .repo-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--color-border-muted);
      }

      .repo-maintainer {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--color-fg-muted);
        cursor: pointer;
      }

      .repo-maintainer:hover {
        color: var(--color-accent-fg);
      }

      .repo-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .repo-tag {
        background-color: rgba(88, 166, 255, 0.1);
        color: var(--color-accent-fg);
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        cursor: pointer;
        border: 1px solid transparent;
      }

      .repo-tag:hover {
        border-color: var(--color-accent-fg);
      }

      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--color-fg-muted);
      }

      .empty-state i {
        font-size: 48px;
        margin-bottom: 16px;
        color: var(--color-fg-subtle);
      }

      .empty-state h3 {
        font-size: 18px;
        margin-bottom: 8px;
        color: var(--color-fg-default);
      }

      .loading-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--color-fg-muted);
      }

      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--color-border-default);
        border-top: 3px solid var(--color-accent-fg);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Repository View Styles */
      .repository-view {
        min-height: 100vh;
        background-color: var(--color-canvas-default);
      }

      .repo-header-full {
        background-color: var(--color-canvas-subtle);
        border-bottom: 1px solid var(--color-border-default);
        padding: 24px 32px;
      }

      .repo-nav {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
      }

      .btn-back {
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: var(--color-btn-bg);
        border: 1px solid var(--color-btn-border);
        color: var(--color-fg-default);
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }

      .btn-back:hover {
        background-color: var(--color-btn-hover-bg);
      }

      .repo-breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--color-fg-muted);
      }

      .repo-name-breadcrumb {
        color: var(--color-accent-fg);
        font-weight: 600;
      }

      .separator {
        color: var(--color-fg-subtle);
      }

      .repo-info-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .repo-title {
        font-size: 32px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--color-fg-default);
      }

      .repo-description {
        font-size: 16px;
        color: var(--color-fg-muted);
        margin-bottom: 16px;
      }

      .repo-meta {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .repo-stat {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 14px;
        color: var(--color-fg-muted);
      }

      .repo-language-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--color-fg-muted);
      }

      .repo-actions {
        display: flex;
        gap: 8px;
      }

      .btn-primary,
      .btn-secondary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid;
      }

      .btn-primary {
        background-color: var(--color-success-fg);
        border-color: var(--color-success-fg);
        color: white;
      }

      .btn-primary:hover {
        background-color: #2ea043;
      }

      .btn-secondary {
        background-color: var(--color-btn-bg);
        border-color: var(--color-btn-border);
        color: var(--color-fg-default);
      }

      .btn-secondary:hover {
        background-color: var(--color-btn-hover-bg);
      }

      .btn-website {
        background-color: var(--color-btn-bg);
        border-color: var(--color-btn-border);
        color: var(--color-fg-default);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        border: 1px solid;
      }

      .btn-website:hover {
        background-color: var(--color-btn-hover-bg);
        color: var(--color-accent-fg);
        border-color: var(--color-accent-fg);
      }

      .website-link {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--color-accent-fg);
        text-decoration: none;
        font-size: 14px;
        transition: all 0.2s;
      }

      .website-link:hover {
        text-decoration: underline;
      }

      .btn-pwa {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: 1px solid #667eea;
        color: white;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
      }

      .btn-pwa:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .btn-pwa:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-pwa .loading-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid transparent;
        border-top: 2px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .repo-content {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px;
      }

      .repo-tabs {
        display: flex;
        border-bottom: 1px solid var(--color-border-default);
        margin-bottom: 24px;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: none;
        border: none;
        color: var(--color-fg-muted);
        cursor: pointer;
        font-size: 14px;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
      }

      .tab.active {
        color: var(--color-fg-default);
        border-bottom-color: var(--color-accent-emphasis);
      }

      .tab:hover {
        color: var(--color-fg-default);
      }

      .file-browser {
        background-color: var(--color-canvas-subtle);
        border: 1px solid var(--color-border-default);
        border-radius: 6px;
        margin-bottom: 24px;
      }

      .breadcrumb-nav {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        background-color: var(--color-canvas-default);
        border-bottom: 1px solid var(--color-border-muted);
        font-size: 14px;
        flex-wrap: wrap;
      }

      .breadcrumb-item {
        color: var(--color-accent-fg);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 4px;
        transition: background-color 0.2s;
      }

      .breadcrumb-item:hover {
        background-color: var(--color-btn-bg);
      }

      .breadcrumb-separator {
        color: var(--color-fg-muted);
        margin: 0 4px;
      }

      .file-list {
        padding: 0;
      }

      .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--color-border-muted);
        transition: background-color 0.2s;
      }

      .file-item:last-child {
        border-bottom: none;
      }

      .file-item:hover {
        background-color: var(--color-canvas-default);
      }

      .file-item.clickable {
        cursor: pointer;
      }

      .file-item.clickable:hover {
        background-color: var(--color-btn-bg);
      }

      .file-item.clickable .file-name {
        color: var(--color-accent-fg);
        font-weight: 600;
      }

      .file-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .file-info i {
        width: 16px;
        color: var(--color-fg-muted);
      }

      .file-info i.fa-folder {
        color: #58a6ff;
      }

      .file-info i.fa-js-square {
        color: #f1e05a;
      }

      .file-info i.fa-react {
        color: #61dafb;
      }

      .file-info i.fa-html5 {
        color: #e34c26;
      }

      .file-info i.fa-css3-alt {
        color: #1572b6;
      }

      .file-info i.fa-markdown {
        color: #083fa1;
      }

      .file-info i.fa-python {
        color: #3776ab;
      }

      .file-info i.fa-java {
        color: #ed8b00;
      }

      .file-info i.fa-image {
        color: #f368e0;
      }

      .file-name {
        color: var(--color-accent-fg);
        font-weight: 500;
      }

      .file-size {
        color: var(--color-fg-muted);
        font-size: 12px;
      }

      .readme-section {
        background-color: var(--color-canvas-subtle);
        border: 1px solid var(--color-border-default);
        border-radius: 6px;
        padding: 24px;
      }

      .readme-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        font-size: 20px;
        font-weight: 600;
        color: var(--color-fg-default);
      }

      .readme-content {
        color: var(--color-fg-default);
        line-height: 1.6;
      }

      .readme-content pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: inherit;
        margin: 0;
      }

      .repo-loading,
      .repo-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 40px;
        color: var(--color-fg-muted);
      }

      .repo-error i {
        font-size: 48px;
        margin-bottom: 16px;
        color: var(--color-danger-fg);
      }

      .repo-loading h3,
      .repo-error h3 {
        color: var(--color-fg-default);
        margin-bottom: 8px;
      }

      /* Commits View Styles */
      .commits-list {
        background-color: var(--color-canvas-subtle);
        border: 1px solid var(--color-border-default);
        border-radius: 6px;
        overflow: hidden;
      }

      .commit-item {
        display: flex;
        align-items: flex-start;
        padding: 16px;
        border-bottom: 1px solid var(--color-border-muted);
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .commit-item:last-child {
        border-bottom: none;
      }

      .commit-item:hover {
        background-color: var(--color-canvas-default);
      }

      .commit-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: var(--color-accent-emphasis);
        margin-right: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 14px;
        flex-shrink: 0;
      }

      .commit-info {
        flex: 1;
        min-width: 0;
      }

      .commit-message {
        font-size: 14px;
        font-weight: 500;
        color: var(--color-fg-default);
        margin-bottom: 4px;
        line-height: 1.3;
      }

      .commit-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--color-fg-muted);
        flex-wrap: wrap;
      }

      .commit-author {
        font-weight: 500;
      }

      .commit-hash {
        font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono',
          monospace;
        background-color: var(--color-btn-bg);
        padding: 2px 6px;
        border-radius: 3px;
        border: 1px solid var(--color-btn-border);
      }

      .commit-stats {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-shrink: 0;
      }

      .commit-stat {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--color-fg-muted);
      }

      /* Commit Detail View */
      .commit-detail {
        background-color: var(--color-canvas-subtle);
        border: 1px solid var(--color-border-default);
        border-radius: 6px;
        overflow: hidden;
      }

      .commit-detail-header {
        padding: 20px;
        border-bottom: 1px solid var(--color-border-default);
        background-color: var(--color-canvas-default);
      }

      .commit-detail-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .btn-back-commit {
        display: flex;
        align-items: center;
        gap: 6px;
        background-color: var(--color-btn-bg);
        border: 1px solid var(--color-btn-border);
        color: var(--color-fg-default);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
      }

      .btn-back-commit:hover {
        background-color: var(--color-btn-hover-bg);
      }

      .commit-detail-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--color-fg-default);
        margin-bottom: 8px;
        line-height: 1.3;
      }

      .commit-detail-meta {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 14px;
        color: var(--color-fg-muted);
        flex-wrap: wrap;
      }

      .commit-detail-author {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .commit-detail-hash {

  <body>
    <div id="app"></div>

    <script type="module">
      import { h, render } from 'https://cdn.skypack.dev/preact@10.19.3'
      import {
        useState,
        useEffect
      } from 'https://cdn.skypack.dev/preact@10.19.3/hooks'
      import { html } from 'https://cdn.skypack.dev/htm@3.1.1/preact'
      import git from 'https://cdn.skypack.dev/isomorphic-git@1.24.5'
      import http from 'https://cdn.skypack.dev/isomorphic-git@1.24.5/http/web'

      // Debugging will be handled by the git HTTP client

      function Repository({ repo, onBack }) {
        const [loading, setLoading] = useState(true)
        const [error, setError] = useState(null)
        const [repoData, setRepoData] = useState(null)
        const [currentPath, setCurrentPath] = useState('')
        const [files, setFiles] = useState([])
        const [readme, setReadme] = useState('')
        const [commits, setCommits] = useState([])
        const [pathHistory, setPathHistory] = useState([''])
        const [activeTab, setActiveTab] = useState('code')
        const [selectedCommit, setSelectedCommit] = useState(null)
        const [fileModal, setFileModal] = useState({
          isOpen: false,
          file: null,
          content: ''
        })
        const [deploying, setDeploying] = useState(false)
        const [deployedSite, setDeployedSite] = useState(null)
        const [realFs, setRealFs] = useState(null)

        useEffect(() => {
          // Clear all state when switching repositories
          setFiles([])
          setReadme('')
          setCommits([])
          setCurrentPath('')
          setPathHistory([''])
          setActiveTab('code')
          setSelectedCommit(null)
          setFileModal({
            isOpen: false,
            file: null,
            content: ''
          })
          setRealFs(null)

          loadRepository()
        }, [repo.url, repo.name])

        useEffect(() => {
          const handleKeyDown = e => {
            if (e.key === 'Escape' && fileModal.isOpen) {
              closeFileModal()
            }
          }

          if (fileModal.isOpen) {
            document.addEventListener('keydown', handleKeyDown)
            document.body.style.overflow = 'hidden'
          } else {
            document.body.style.overflow = ''
          }

          return () => {
            document.removeEventListener('keydown', handleKeyDown)
            document.body.style.overflow = ''
          }
        }, [fileModal.isOpen])

        const loadRepository = async () => {
          try {
            setLoading(true)
            setError(null)

            console.log('Loading repository:', repo.name, 'URL:', repo.url)

            // Generate repository-specific data using repo URL + name as seed
            const repoSeed = (repo.name + repo.url).toLowerCase()
            const repoHash = repoSeed
              .split('')
              .reduce((a, b) => a + b.charCodeAt(0), 0)

            // Add some randomness but keep it deterministic per repo
            const seedRandom = seed => {
              const x = Math.sin(seed) * 10000
              return x - Math.floor(x)
            }

            const getRepoStats = () => ({
              stars: Math.floor(seedRandom(repoHash + 1) * 2000),
              forks: Math.floor(seedRandom(repoHash + 2) * 500),
              issues: Math.floor(seedRandom(repoHash + 3) * 100)
            })

            const getRepoLanguage = () => {
              const languages = [
                'JavaScript',
                'Python',
                'TypeScript',
                'Go',
                'Rust',
                'Java',
                'C++',
                'PHP',
                'Ruby',
                'Swift'
              ]
              return languages[repoHash % languages.length]
            }

            setRepoData({
              name: repo.name,
              url: repo.url,
              description: getRepoDescription(),
              ...getRepoStats(),
              language: getRepoLanguage()
            })

            // Always try to clone - let git operations fail naturally if not a repo
            // Try to clone the actual repository first
            try {
              console.log('Attempting to clone repository:', repo.url)

              // Normalize URL to prevent double slashes (used for both test and clone)
              const normalizedUrl = repo.url.endsWith('/')
                ? repo.url.slice(0, -1)
                : repo.url
              console.log('🔧 Using normalized URL:', normalizedUrl)

              // Create a compatible filesystem for isomorphic-git using LightningFS
              // Use LightningFS which is specifically designed for isomorphic-git
              const { default: LightningFS } = await import(
                'https://cdn.skypack.dev/@isomorphic-git/lightning-fs'
              )
              const fs = new LightningFS('fs')

              // Clear any existing repository data to prevent conflicts
              try {
                console.log(
                  '🧹 Aggressively cleaning up existing repository data...'
                )

                // First, try to completely wipe LightningFS storage for this repo
                try {
                  // Create a completely fresh LightningFS instance to avoid cached data
                  const freshFs = new LightningFS('fs-cleanup')

                  // Try to remove individual files first
                  const filesToRemove = [
                    '/repo/.well-known/txo/txo.json',
                    '/repo/index.json',
                    '/repo/.git/HEAD',
                    '/repo/.git/config',
                    '/repo/.git/index'
                  ]

                  for (const file of filesToRemove) {
                    try {
                      await fs.unlink(file)
                      console.log(`🗑️ Removed ${file}`)
                    } catch (unlinkError) {
                      // File doesn't exist, which is fine
                    }
                  }

                  // Try to remove directories recursively
                  const dirsToRemove = [
                    '/repo/.well-known',
                    '/repo/.git',
                    '/repo'
                  ]

                  for (const dir of dirsToRemove) {
                    try {
                      // List all files in directory first
                      const files = await fs.readdir(dir)
                      console.log(
                        `📂 Found ${files.length} items in ${dir}:`,
                        files
                      )

                      // Remove each file individually
                      for (const file of files) {
                        const filePath = `${dir}/${file}`
                        try {
                          const stat = await fs.stat(filePath)
                          if (stat.isDirectory()) {
                            // Skip subdirectories for now, remove files only
                            console.log(`📁 Skipping subdirectory ${filePath}`)
                          } else {
                            await fs.unlink(filePath)
                            console.log(`🗑️ Removed file ${filePath}`)
                          }
                        } catch (fileError) {
                          console.log(
                            `⚠️ Could not remove ${filePath}:`,
                            fileError.message
                          )
                        }
                      }

                      // Finally remove the empty directory
                      await fs.rmdir(dir)
                      console.log(`✅ Removed directory ${dir}`)
                    } catch (dirError) {
                      console.log(
                        `📁 Directory ${dir} not found or already removed`
                      )
                    }
                  }
                } catch (statError) {
                  console.log('📁 No existing repository data found')
                }

                // Create a completely fresh /repo directory
                try {
                  await fs.mkdir('/repo')
                  console.log('✅ Created fresh /repo directory')
                } catch (mkdirError) {
                  console.log('📁 /repo directory already exists or created')
                }

                // Also add force flag to git operations to overwrite any remaining files
                console.log(
                  '✅ Cleanup completed, will use force flags for git operations'
                )
              } catch (cleanupError) {
                console.log('⚠️ Cleanup error:', cleanupError.message)
                // Continue anyway - we'll use force flags
              }

              // First test if this is actually a git repository by checking info/refs
              console.log('Testing git info/refs endpoint...')

              try {
                const infoRefsUrl = `${normalizedUrl}/info/refs?service=git-upload-pack`

                console.log('Checking:', infoRefsUrl)
                const testResponse = await fetch(infoRefsUrl)
                console.log('Info/refs response status:', testResponse.status)
                console.log(
                  'Info/refs response headers:',
                  Object.fromEntries(testResponse.headers.entries())
                )

                const responseText = await testResponse.text()
                console.log(
                  'Info/refs response body (first 200 chars):',
                  responseText.substring(0, 200)
                )
                console.log(
                  'Info/refs response body (full length):',
                  responseText.length
                )

                if (!responseText.includes('service=git-upload-pack')) {
                  throw new Error(
                    'Response does not contain git-upload-pack service - not a git repository'
                  )
                }
              } catch (infoError) {
                console.log('Info/refs test failed:', infoError.message)
                throw new Error(
                  'Git info/refs endpoint test failed: ' + infoError.message
                )
              }

              console.log('✅ Git info/refs test passed, attempting clone...')

              // Try multiple approaches to git cloning
              console.log(
                '🔄 Attempting clone with built-in HTTP client first...'
              )

              try {
                // First try with the standard isomorphic-git http client
                await git.clone({
                  fs: fs,
                  http: http, // Use the standard http client
                  dir: '/repo',
                  url: normalizedUrl,
                  depth: 1,
                  singleBranch: true,
                  noCheckout: false,
                  force: true // Force overwrite any existing files
                })

                console.log(
                  '✅ Repository cloned successfully with standard client!'
                )
                setRealFs(fs)
                await loadRealData('', fs)
                setLoading(false) // Ensure loading stops after real data is loaded
                return // Success, exit early
              } catch (standardError) {
                console.log(
                  '❌ Standard HTTP client failed:',
                  standardError.message
                )
                console.log('🔄 Trying with custom debug HTTP client...')
              }

              // Create enhanced HTTP client with debugging as fallback
              let requestCount = 0
              const debugHttp = {
                request: async (urlOrOptions, optionalOptions = {}) => {
                  requestCount++
                  const reqId = `[REQ-${requestCount}]`

                  // isomorphic-git can pass either a URL string or an options object
                  let url, options

                  if (typeof urlOrOptions === 'string') {
                    // Old style: request(url, options)
                    url = urlOrOptions
                    options = optionalOptions
                  } else {
                    // New style: request({url, method, headers, body, ...})
                    url = urlOrOptions.url
                    options = {
                      method: urlOrOptions.method,
                      headers: urlOrOptions.headers,
                      body: urlOrOptions.body,
                      ...optionalOptions
                    }
                  }

                  console.log(
                    `🚀 ${reqId} Git HTTP request:`,
                    url,
                    options.method || 'GET'
                  )
                  console.log(`🚀 ${reqId} Request headers:`, options.headers)
                  console.log(
                    `🚀 ${reqId} Request body length:`,
                    options.body ? options.body.length : 0
                  )

                  if (
                    options.body &&
                    options.body.length > 0 &&
                    options.body.length < 500
                  ) {
                    console.log(`🚀 ${reqId} Request body:`, options.body)
                  }

                  try {
                    const response = await fetch(url, options)

                    console.log(
                      `✅ ${reqId} Git HTTP response:`,
                      response.status,
                      response.statusText
                    )
                    console.log(
                      `✅ ${reqId} Response headers:`,
                      Object.fromEntries(response.headers.entries())
                    )

                    // Clone the response to read the body for debugging without consuming it
                    const clonedResponse = response.clone()
                    try {
                      const text = await clonedResponse.text()
                      console.log(
                        `✅ ${reqId} Response body length:`,
                        text.length
                      )
                      console.log(
                        `✅ ${reqId} Response body (first 200 chars):`,
                        text.substring(0, 200)
                      )

                      // For git protocol responses, show more detail
                      if (text.length > 0 && !text.startsWith('<')) {
                        console.log(
                          `✅ ${reqId} Response appears to be git protocol data`
                        )
                      } else if (text.startsWith('<')) {
                        console.log(
                          `❌ ${reqId} Response appears to be HTML (error page?)`
                        )
                      }
                    } catch (e) {
                      console.log(
                        `❌ ${reqId} Could not read response body for debugging:`,
                        e.message
                      )
                    }

                    // Check if response indicates an error
                    if (!response.ok) {
                      console.log(
                        `❌ ${reqId} HTTP error status:`,
                        response.status,
                        response.statusText
                      )
                    }

                    return response
                  } catch (fetchError) {
                    console.log(`❌ ${reqId} Fetch failed:`, fetchError.message)
                    throw fetchError
                  }
                }
              }

              // Use the already normalized URL from above

              try {
                // Attempt to clone with custom debug HTTP client
                await git.clone({
                  fs: fs,
                  http: debugHttp,
                  dir: '/repo',
                  url: normalizedUrl,
                  depth: 1,
                  singleBranch: true,
                  noCheckout: false,
                  force: true // Force overwrite any existing files
                })

                console.log(
                  '✅ Repository cloned successfully with debug client!'
                )
                setRealFs(fs)
                await loadRealData('', fs)
                setLoading(false)
              } catch (debugError) {
                console.log(
                  '❌ Debug HTTP client also failed:',
                  debugError.message
                )
                console.log('🔄 Trying different clone configurations...')

                // Try without depth limit
                try {
                  await git.clone({
                    fs: fs,
                    http: http,
                    dir: '/repo2',
                    url: normalizedUrl,
                    singleBranch: true,
                    noCheckout: false,
                    force: true // Force overwrite any existing files
                    // No depth limit
                  })

                  console.log(
                    '✅ Repository cloned successfully without depth limit!'
                  )
                  setRealFs(fs)
                  await loadRealData('', fs)
                  setLoading(false)
                } catch (noDepthError) {
                  console.log(
                    '❌ Clone without depth limit failed:',
                    noDepthError.message
                  )

                  // Try with noCheckout
                  try {
                    await git.clone({
                      fs: fs,
                      http: http,
                      dir: '/repo3',
                      url: normalizedUrl,
                      singleBranch: true,
                      noCheckout: true, // Don't checkout files
                      force: true // Force overwrite any existing files
                    })

                    console.log(
                      '✅ Repository cloned successfully with noCheckout!'
                    )
                    setRealFs(fs)
                    await loadRealData('', fs)
                    setLoading(false)
                  } catch (noCheckoutError) {
                    console.log('❌ All git clone strategies failed')
                    console.log('Debug error:', debugError.message)
                    console.log('No depth error:', noDepthError.message)
                    console.log('No checkout error:', noCheckoutError.message)
                    throw new Error('All git clone strategies failed')
                  }
                }
              }
            } catch (cloneError) {
              console.log('Git clone failed:', cloneError)
              console.log('Error details:', {
                name: cloneError.name,
                message: cloneError.message,
                stack: cloneError.stack
              })

              // Check if the URL might not be a git repository
              if (
                cloneError.message.includes('bind') ||
                cloneError.message.includes('http') ||
                cloneError.name === 'TypeError'
              ) {
                console.log(
                  'This appears to be a module loading issue, not a git issue'
                )
              } else if (
                cloneError.message.includes('404') ||
                cloneError.message.includes('not found')
              ) {
                console.log(
                  'Repository not found - this might not be a git URL'
                )
              } else {
                console.log('Unknown git error - falling back to mock data')
              }

              // Fall back to mock data if cloning fails
              loadMockData('')
            }

            setLoading(false)
          } catch (err) {
            console.error('Repository loading error:', err)
            setError(err.message)
            setLoading(false)
          }
        }

        const getRepoDescription = () => {
          const repoSeed = (repo.name + repo.url).toLowerCase()
          const repoHash = repoSeed
            .split('')
            .reduce((a, b) => a + b.charCodeAt(0), 0)

          const descriptions = [
            'A modern web application with clean architecture',
            'Lightweight library for developers',
            'Full-stack application with REST API',
            'Command-line tool written in modern languages',
            'Documentation and tutorial collection',
            'Mobile-first responsive framework',
            'Data analysis and visualization tools',
            'Machine learning experiments and models',
            'DevOps automation scripts and configurations',
            'Open source contribution to the community'
          ]

          return descriptions[repoHash % descriptions.length]
        }

        const loadRealData = async (path = '', fs) => {
          try {
            console.log(
              'loadRealData called for repo:',
              repo.name,
              'path:',
              path
            )
            const repoPath = '/repo' + (path ? '/' + path : '')

            // Read directory contents using LightningFS
            const entries = await fs.promises.readdir(repoPath)
            const files = []

            for (const entry of entries) {
              if (entry === '.git') continue // Skip .git directory

              const entryPath = repoPath + '/' + entry
              try {
                const stat = await fs.promises.stat(entryPath)
                files.push({
                  name: entry,
                  type: stat.isDirectory() ? 'directory' : 'file',
                  size: stat.isFile()
                    ? `${(stat.size / 1024).toFixed(1)} KB`
                    : '-'
                })
              } catch (err) {
                console.log('Error reading entry:', entry, err)
              }
            }

            console.log('Real files loaded:', files)
            setFiles(files)
            setCurrentPath(path)

            // Load README if at root level
            if (path === '') {
              try {
                const readmePath = '/repo/README.md'
                const readmeContent = await fs.promises.readFile(
                  readmePath,
                  'utf8'
                )
                setReadme(readmeContent)
                console.log('README loaded from real repository')
              } catch (err) {
                console.log('No README found, using default')
                setReadme(
                  '# ' +
                    repo.name +
                    '\n\nThis repository was loaded from: ' +
                    repo.url
                )
              }
            } else {
              setReadme('')
            }

            // Load real commits from git history
            try {
              console.log('Loading real commits from git history...')

              let commits = null
              let commitRef = 'HEAD'

              // Strategy 1: Try with HEAD first
              try {
                console.log('Trying git.log with HEAD...')
                const commitPromise = git.log({
                  fs,
                  dir: '/repo',
                  ref: 'HEAD',
                  depth: 10
                })

                const timeoutPromise = new Promise((_, reject) =>
                  setTimeout(
                    () => reject(new Error('Commit loading timeout')),
                    5000
                  )
                )

                commits = await Promise.race([commitPromise, timeoutPromise])
                console.log('✅ Got commits with HEAD reference')
              } catch (headError) {
                console.log('❌ HEAD failed:', headError.message)

                // Strategy 2: Try direct remote references and list all branches
                try {
                  // First try origin/HEAD directly
                  console.log('Trying origin/HEAD directly...')
                  try {
                    const commitPromise = git.log({
                      fs,
                      dir: '/repo',
                      ref: 'origin/HEAD',
                      depth: 10
                    })

                    const timeoutPromise = new Promise((_, reject) =>
                      setTimeout(

          ]

          return readmeVariants[repoHash % readmeVariants.length]
        }

        const getMockCommits = () => {
          const repoSeed = (repo.name + repo.url).toLowerCase()
          const repoHash = repoSeed
            .split('')
            .reduce((a, b) => a + b.charCodeAt(0), 0)

          console.log('getMockCommits for', repo.name, 'hash:', repoHash)

          // Generate unique commits based on hash
          const seedRandom = seed => {
            const x = Math.sin(seed) * 10000
            return x - Math.floor(x)
          }

          const generateHash = seed => {
            const chars = '0123456789abcdef'
            let hash = ''
            for (let i = 0; i < 15; i++) {
              hash += chars[Math.floor(seedRandom(seed + i) * 16)]
            }
            return hash
          }

          const authors = [
            'Developer',
            'Contributor',
            'Maintainer',
            'CodeBot',
            'TeamLead'
          ]
          const commitMessages = [
            'Initial commit',
            'Add core functionality',
            'Fix bug in main module',
            'Update documentation',
            'Improve performance',
            'Add tests and CI',
            'Refactor code structure',
            'Update dependencies',
            'Add new features',
            'Fix compatibility issues'
          ]

          const commits = []
          const numCommits = Math.max(
            2,
            Math.floor(seedRandom(repoHash) * 6) + 1
          )

          for (let i = 0; i < numCommits; i++) {
            const commitSeed = repoHash + i * 100
            const hash = generateHash(commitSeed)
            const author =
              authors[Math.floor(seedRandom(commitSeed + 1) * authors.length)]
            const message =
              commitMessages[
                Math.floor(seedRandom(commitSeed + 2) * commitMessages.length)
              ]
            const filesChanged = Math.floor(seedRandom(commitSeed + 3) * 5) + 1
            const additions = Math.floor(seedRandom(commitSeed + 4) * 100) + 10
            const deletions = Math.floor(seedRandom(commitSeed + 5) * 20)

            // Generate files for this commit
            const files = []
            const fileNames = [
              'README.md',
              'main.js',
              'index.html',
              'utils.py',
              'config.json',
              'styles.css',
              'app.go',
              'test.rs'
            ]
            const statuses = ['added', 'modified', 'deleted']

            for (let j = 0; j < filesChanged; j++) {
              const fileSeed = commitSeed + j * 10
              const fileName =
                fileNames[Math.floor(seedRandom(fileSeed) * fileNames.length)]
              const status =
                statuses[Math.floor(seedRandom(fileSeed + 1) * statuses.length)]
              const fileAdditions =
                Math.floor(seedRandom(fileSeed + 2) * 50) + 1
              const fileDeletions =
                status === 'added'
                  ? 0
                  : Math.floor(seedRandom(fileSeed + 3) * 10)

              files.push({
                name: fileName,
                status: status,
                additions: fileAdditions,
                deletions: fileDeletions
              })
            }

            commits.push({
              hash: hash,
              shortHash: hash.substring(0, 7),
              message: message,
              author: author,
              email: `${author.toLowerCase()}@example.com`,
              date: new Date(
                Date.now() - i * 86400000 * seedRandom(commitSeed + 6)
              ).toISOString(),
              avatar: `https://github.com/identicons/${
                Math.floor(seedRandom(commitSeed + 7) * 10) + 1
              }.png`,
              filesChanged: filesChanged,
              additions: additions,
              deletions: deletions,
              files: files
            })
          }

          return commits.sort((a, b) => new Date(b.date) - new Date(a.date))
        }

      function App() {
        const [events, setEvents] = useState([])
        const [status, setStatus] = useState('connecting')
        const [connections, setConnections] = useState([])
        const [activeFilters, setActiveFilters] = useState(new Set())
        const [allEvents, setAllEvents] = useState([])
        const [searchTerm, setSearchTerm] = useState('')
        const [currentView, setCurrentView] = useState('explore') // 'explore' or 'repo'
        const [currentRepo, setCurrentRepo] = useState(null)

        useEffect(() => {
          const urlParams = new URLSearchParams(window.location.search)
          const filterParam = urlParams.get('filter')
          const repoUrl = urlParams.get('repo')
          const repoName = urlParams.get('name')
          const websiteUrl = urlParams.get('website')

          if (repoUrl && repoName) {
            setCurrentView('repo')
            setCurrentRepo({
              url: repoUrl,
              name: repoName,
              website: websiteUrl
            })
          } else {
            setCurrentView('explore')
            if (filterParam) {
              setActiveFilters(new Set(filterParam.split(',')))
            }
            connectToRelays()
          }

          return () => {
            connections.forEach(conn => {
              if (conn.ws) {
                conn.ws.close()
              }
            })
          }
        }, [])

        useEffect(() => {
          let filtered = allEvents

          // Apply search filter
          if (searchTerm) {
            filtered = filtered.filter(event => {
              const repo = parseRepoInfo(event)
              return (
                repo.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                repo.description
                  .toLowerCase()
                  .includes(searchTerm.toLowerCase()) ||
                repo.url.toLowerCase().includes(searchTerm.toLowerCase())
              )
            })
          }

          // Apply tag filters (AND logic)
          if (activeFilters.size > 0) {
            filtered = filtered.filter(event => {
              return Array.from(activeFilters).every(filterTag => {
                if (filterTag.startsWith('pubkey=')) {
                  const pubkey = filterTag.substring('pubkey='.length)
                  return event.pubkey === pubkey
                }
                return event.tags?.some(tag => {
                  const tagString = `${tag[0]}=${tag[1] || ''}`
                  return tagString === filterTag
                })
              })
            })
          }

          setEvents(filtered)
        }, [allEvents, activeFilters, searchTerm])

        const relays = [
          'wss://relay.nostr.net/',
          'wss://nos.lol/',
          'wss://relay.damus.io/',
          'wss://nostr.wine/',
          'wss://relay.snort.social/',
          'wss://nostr.mom/',
          'wss://relay.nostr.band/',
          'wss://purplepag.es/',
          'wss://offchain.pub/'
        ]

        const connectToRelays = () => {
          setStatus('connecting')
          const newConnections = []

          relays.forEach((relayUrl, index) => {
            const websocket = new WebSocket(relayUrl)
            const conn = { url: relayUrl, ws: websocket, connected: false }

            websocket.onopen = () => {
              conn.connected = true
              setConnections(prev => {
                const updated = [...prev]
                const existing = updated.find(c => c.url === relayUrl)
                if (existing) {
                  existing.connected = true
                } else {
                  updated.push(conn)
                }
                return updated
              })

              setStatus(prevStatus =>
                prevStatus === 'connecting' ? 'connected' : prevStatus
              )

              const subscription = JSON.stringify([
                'REQ',
                `nip34-sub-${index}`,
                {
                  kinds: [30617],
                  limit: 25
                }
              ])
              websocket.send(subscription)
            }

            websocket.onmessage = event => {
              try {
                const message = JSON.parse(event.data)
                if (message[0] === 'EVENT' && message[2]) {
                  const nostrEvent = message[2]
                  if (nostrEvent.kind === 30617) {
                    setAllEvents(prev => {
                      const dTag = nostrEvent.tags?.find(
                        tag => tag[0] === 'd'
                      )?.[1]
                      const existingIndex = prev.findIndex(e => {
                        const existingDTag = e.tags?.find(
                          tag => tag[0] === 'd'
                        )?.[1]
                        return (
                          e.pubkey === nostrEvent.pubkey &&
                          existingDTag === dTag
                        )
                      })

                      let newEvents
                      if (existingIndex !== -1) {
                        newEvents = [
                          nostrEvent,
                          ...prev.slice(0, existingIndex),
                          ...prev.slice(existingIndex + 1)
                        ]
                      } else {
                        newEvents = [nostrEvent, ...prev]
                      }

                      return newEvents.sort(
                        (a, b) => b.created_at - a.created_at
                      )
                    })
                  }
                }
              } catch (err) {
                console.error('Error parsing message:', err)
              }
            }

            websocket.onerror = () => {
              conn.connected = false
            }

            websocket.onclose = () => {
              conn.connected = false
              setTimeout(() => {
                if (!conn.connected) {
                  connectToSingleRelay(relayUrl, index)
                }
              }, 10000)
            }

            newConnections.push(conn)
          })

          setConnections(newConnections)
        }

        const connectToSingleRelay = (relayUrl, index) => {
          const websocket = new WebSocket(relayUrl)

          websocket.onopen = () => {
            setConnections(prev => {
              const updated = [...prev]
              const existing = updated.find(c => c.url === relayUrl)
              if (existing) {
                existing.ws = websocket
                existing.connected = true
              }
              return updated
            })

            const subscription = JSON.stringify([
              'REQ',
              `nip34-sub-${index}`,
              {
                kinds: [30617],
                limit: 100
              }
            ])
            websocket.send(subscription)
          }

          websocket.onmessage = event => {
            try {
              const message = JSON.parse(event.data)
              if (message[0] === 'EVENT' && message[2]) {
                const nostrEvent = message[2]
                if (nostrEvent.kind === 30617) {
                  setAllEvents(prev => {
                    const dTag = nostrEvent.tags?.find(
                      tag => tag[0] === 'd'
                    )?.[1]
                    const existingIndex = prev.findIndex(e => {
                      const existingDTag = e.tags?.find(
                        tag => tag[0] === 'd'
                      )?.[1]
                      return (
                        e.pubkey === nostrEvent.pubkey && existingDTag === dTag
                      )
                    })

                    let newEvents
                    if (existingIndex !== -1) {
                      newEvents = [
                        nostrEvent,
                        ...prev.slice(0, existingIndex),
                        ...prev.slice(existingIndex + 1)
                      ]
                    } else {
                      newEvents = [nostrEvent, ...prev]
                    }

                    return newEvents.sort((a, b) => b.created_at - a.created_at)
                  })
                }
              }
            } catch (err) {
              console.error('Error parsing message:', err)
            }
          }

          websocket.onerror = () => {
            setConnections(prev => {
              const updated = [...prev]
              const existing = updated.find(c => c.url === relayUrl)
              if (existing) {
                existing.connected = false
              }
              return updated
            })
          }

          websocket.onclose = () => {
            setTimeout(() => {
              connectToSingleRelay(relayUrl, index)
            }, 10000)
          }
        }

        const parseRepoInfo = event => {
          const tags = event.tags || []
          const info = {
            name: event.content || 'Untitled Repository',
            description: '',
            url: '',
            website: '',
            cloneUrl: '',
            maintainers: []
          }

          tags.forEach(tag => {
            if (tag[0] === 'name' && tag[1]) {
              info.name = tag[1]
            } else if (tag[0] === 'd' && tag[1]) {
              if (!info.name || info.name === 'Untitled Repository')
                info.name = tag[1]
            } else if (tag[0] === 'description' && tag[1]) {
              info.description = tag[1]
            } else if (tag[0] === 'r' && tag[1]) {
              info.url = tag[1]
            } else if (tag[0] === 'web' && tag[1]) {
              info.website = tag[1]
            } else if (tag[0] === 'clone' && tag[1] && !info.cloneUrl) {
              info.cloneUrl = tag[1]
            } else if (tag[0] === 'p' && tag[1]) {
              info.maintainers.push(tag[1])
            }
          })

          if (!info.description && event.content !== info.name) {
            info.description = event.content
          }

          return info
        }

        const getLanguageColor = language => {
          const colors = {
            javascript: '#f1e05a',
            python: '#3572A5',
            java: '#b07219',
            typescript: '#2b7489',
            rust: '#dea584',
            go: '#00ADD8',
            cpp: '#f34b7d',
            c: '#555555',
            html: '#e34c26',
            css: '#563d7c',
            vue: '#2c3e50',
            react: '#61DAFB',
            angular: '#DD0031',
            php: '#4F5D95',
            ruby: '#701516',
            swift: '#ffac45',
            kotlin: '#F18E33',
            dart: '#00B4AB',
            shell: '#89e051',
            default: '#858585'
          }
          return colors[language?.toLowerCase()] || colors.default
        }

        const getRandomLanguage = () => {
          const languages = [
            'JavaScript',
            'Python',
            'TypeScript',
            'Rust',
            'Go',
            'Java',
            'C++',
            'HTML',
            'CSS'
          ]
          return languages[Math.floor(Math.random() * languages.length)]
        }

        const getRandomStats = () => ({
          stars: Math.floor(Math.random() * 1000),
          forks: Math.floor(Math.random() * 200),
          issues: Math.floor(Math.random() * 50)
        })

        const handleTagClick = tag => {
          const tagString = `${tag[0]}=${tag[1] || ''}`
          const newFilters = new Set(activeFilters)

          if (newFilters.has(tagString)) {
            newFilters.delete(tagString)
          } else {
            newFilters.add(tagString)
          }

          setActiveFilters(newFilters)
        }

        const clearFilters = () => {
          setActiveFilters(new Set())
          setSearchTerm('')
        }

        const getConnectionStatus = () => {
          const connectedCount = connections.filter(c => c.connected).length
          return `${connectedCount}/${connections.length} relays`
        }

        const formatTime = timestamp => {
          const now = Date.now()
          const eventTime = timestamp * 1000
          const diff = now - eventTime
          const days = Math.floor(diff / (1000 * 60 * 60 * 24))

          if (days === 0) return 'today'
          if (days === 1) return '1 day ago'
          if (days < 30) return `${days} days ago`
          if (days < 365) return `${Math.floor(days / 30)} months ago`
          return `${Math.floor(days / 365)} years ago`
        }

        const navigateToRepo = (repoUrl, repoName, websiteUrl = null) => {
          const url = new URL(window.location)
          url.searchParams.set('repo', repoUrl)
          url.searchParams.set('name', repoName)
          if (websiteUrl) {
            url.searchParams.set('website', websiteUrl)
          }
          window.history.pushState({}, '', url)
          setCurrentView('repo')
          setCurrentRepo({ url: repoUrl, name: repoName, website: websiteUrl })
        }

        const navigateToExplore = () => {
          const url = new URL(window.location)
          url.searchParams.delete('repo')
          url.searchParams.delete('name')
          window.history.pushState({}, '', url)
          setCurrentView('explore')
          setCurrentRepo(null)
          if (connections.length === 0) {
            connectToRelays()
          }
        }

        if (currentView === 'repo' && currentRepo) {
          return html`<${Repository}
            key=${currentRepo.url + ':' + currentRepo.name}
            repo=${currentRepo}
            onBack=${navigateToExplore}
          />`
        }

        return html`
          <header class="header">
            <div class="header-content">
              <a href="/" class="logo">
                <i class="fab fa-git-alt"></i>
                Git Explore
              </a>

              <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input
                  type="text"
                  class="search-input"
                  placeholder="Search repositories..."
                  value=${searchTerm}
                  onInput=${e => setSearchTerm(e.target.value)}
                />
              </div>

              <div class="status-indicator">
                <div class="status-dot"></div>
                ${getConnectionStatus()}
              </div>
            </div>
          </header>

          <main class="main-content">
            <div class="page-header">
              <h1 class="page-title">Explore Repositories</h1>
              <p class="page-description">
                Discover Git repositories announced on the decentralized Nostr
                network
              </p>
            </div>

            ${(activeFilters.size > 0 || searchTerm) &&
            html`
              <div class="filters">
                ${searchTerm &&
                html`
                  <div class="filter-group">
                    <span class="filter-label">Search:</span>
                    <span class="filter-tag active">${searchTerm}</span>
                  </div>
                `}
                ${activeFilters.size > 0 &&
                html`
                  <div class="filter-group">
                    <span class="filter-label">Filters:</span>
                    ${Array.from(activeFilters).map(
                      filter => html`
                        <span key=${filter} class="filter-tag active">
                          ${filter}
                        </span>
                      `
                    )}
                  </div>
                `}
                <button class="clear-filters" onClick=${clearFilters}>
                  Clear all
                </button>
              </div>
            `}
            ${status === 'connecting' &&
            html`
              <div class="loading-state">
                <div class="loading-spinner"></div>
                <h3>Connecting to network...</h3>
                <p>Discovering repositories from Nostr relays</p>
              </div>
            `}
            ${status === 'connected' &&
            events.length === 0 &&
            html`
              <div class="empty-state">
                <i class="fas fa-search"></i>
                <h3>No repositories found</h3>
                <p>Try adjusting your search or filters</p>
              </div>
            `}

            <div class="repositories-grid">
              ${events.map(event => {
                const repo = parseRepoInfo(event)
                const stats = getRandomStats()
                const language = getRandomLanguage()
                const languageColor = getLanguageColor(language)

                return html`
                  <div key=${event.id} class="repository-card">
                    <div class="repo-header">
                      <div>
                        <span
                          class="repo-name"
                          onClick=${() =>
                            navigateToRepo(
                              repo.cloneUrl,
                              repo.name,
                              repo.website
                            )}
                          style="cursor: pointer;"
                        >
                          <i class="fas fa-book"></i>
                          ${repo.name}
                        </span>
                        <div class="repo-visibility">Public</div>
                      </div>
                    </div>

                    ${repo.description &&
                    html` <p class="repo-description">${repo.description}</p> `}

                    <div class="repo-stats">
                      <div class="repo-stat">
                        <i class="far fa-star"></i>
                        ${stats.stars}
                      </div>
                      <div class="repo-stat">
                        <i class="fas fa-code-branch"></i>
                        ${stats.forks}
                      </div>
                      <div class="repo-stat">
                        <i class="fas fa-exclamation-circle"></i>
                        ${stats.issues}
                      </div>
                    </div>

                    <div class="repo-language">
                      <div
                        class="language-dot"
                        style="background-color: ${languageColor}"
                      ></div>
                      ${language}
                    </div>

                    ${repo.website &&
                    html`
                      <a
                        href=${repo.website}
                        target="_blank"
                        class="btn-website"
                        style="margin-top: 12px;"
                        onClick=${e => e.stopPropagation()}
                      >
                        <i class="fas fa-external-link-alt"></i>
                        Visit Website
                      </a>
                    `}
                    ${event.tags &&
                    event.tags.length > 0 &&
                    html`
                      <div class="repo-tags">
                        ${event.tags
                          .slice(0, 3)
                          .map(
                            (tag, i) => html`
                              <span
                                key=${i}
                                class="repo-tag"
                                onClick=${() => handleTagClick(tag)}
                              >
                                ${tag[0]}:${tag[1]
                                  ? tag[1].substring(0, 10)
                                  : ''}${tag[1] && tag[1].length > 10
                                  ? '...'
                                  : ''}
                              </span>
                            `
                          )}
                      </div>
                    `}

                    <div class="repo-footer">
                      ${repo.maintainers.length > 0 &&
                      html`
                        <div class="repo-maintainer">
                          <i class="fas fa-user"></i>
                          ${repo.maintainers[0].substring(0, 8)}...
                        </div>
                      `}
                      <div
                        style="color: var(--color-fg-muted); font-size: 12px;"
                      >
                        Updated ${formatTime(event.created_at)}
                      </div>
                    </div>
                  </div>
                `
              })}
            </div>
          </main>
        `
      }

      render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
